<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器内部错误 - 500</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
        }

        /* 页面背景（仿Windows经典蓝） */
        body {
            background-color: #005EBB;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Windows开机动画容器 */
        .windows-loader {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 40px;
        }

        /* 旋转的Windows徽标 */
        .windows-logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #FFFFFF;
            border-top-color: #00ADEF;
            animation: spin 2s linear infinite;
            position: relative;
        }

        /* 徽标内部Windows四格样式 */
        .windows-logo::before,
        .windows-logo::after {
            content: "";
            position: absolute;
            background-color: #FFFFFF;
        }

        .windows-logo::before {
            width: 30px;
            height: 30px;
            top: 15px;
            left: 15px;
            border-right: 15px solid #00ADEF;
            border-bottom: 15px solid #00ADEF;
        }

        .windows-logo::after {
            width: 30px;
            height: 30px;
            bottom: 15px;
            right: 15px;
            border-left: 15px solid #00ADEF;
            border-top: 15px solid #00ADEF;
        }

        /* 旋转动画（仿Windows开机加载） */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 错误提示文本（仿Windows系统字体样式） */
        .error-text {
            color: #FFFFFF;
            text-align: center;
            line-height: 1.8;
        }

        .error-code {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .error-message {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .error-tip {
            font-size: 14px;
            opacity: 0.8;
        }

        /* 适配移动端 */
        @media (max-width: 768px) {
            .windows-loader {
                width: 80px;
                height: 80px;
            }

            .error-code {
                font-size: 36px;
            }

            .error-message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Windows开机动画加载器 -->
    <div class="windows-loader">
        <div class="windows-logo"></div>
    </div>

    <!-- 错误提示文本 -->
    <div class="error-text">
        <div class="error-code">500</div>
        <div class="error-message">服务器内部错误</div>
        <div class="error-tip">
            系统正在重启服务，请稍候重试<br>
            若问题持续，请联系管理员
        </div>
    </div>
</body>
</html>
