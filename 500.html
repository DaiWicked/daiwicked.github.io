<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器内部错误 - 500</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
        }

        /* 页面背景 */
        body {
            background-color: #070a13;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* 动态极光流体背景 */
        .liquid-fluid-backdrop { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; animation: auroraHueCycle 28s infinite ease-in-out alternate; }
        @keyframes auroraHueCycle { 0% { filter: hue-rotate(0deg) saturate(100%); } 33% { filter: hue-rotate(35deg) saturate(115%); } 66% { filter: hue-rotate(-30deg) saturate(110%); } 100% { filter: hue-rotate(45deg) saturate(105%); } }
        .liquid-drop { position: absolute; filter: blur(85px); opacity: 0.38; mix-blend-mode: screen; animation: liquidMorph 18s infinite ease-in-out alternate; }
        .liquid-drop-1 { width: 600px; height: 600px; background: radial-gradient(circle, #0284c7 15%, #0369a1 45%, transparent 70%); top: -10%; left: 2%; animation-duration: 18s; }
        .liquid-drop-2 { width: 550px; height: 550px; background: radial-gradient(circle, #0d9488 10%, #2563eb 50%, transparent 70%); top: 38%; right: -6%; animation-duration: 24s; animation-delay: -6s; }
        .liquid-drop-3 { width: 480px; height: 480px; background: radial-gradient(circle, #6366f1 15%, #1d4ed8 50%, transparent 70%); bottom: -5%; left: 22%; animation-duration: 21s; animation-delay: -11s; }
        @keyframes liquidMorph { 0% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: translate(0,0) scale(1) rotate(0deg); } 33% { border-radius: 70% 30% 46% 54% / 30% 60% 40% 70%; transform: translate(45px,-35px) scale(1.1) rotate(60deg); } 66% { border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; transform: translate(-30px,45px) scale(0.95) rotate(120deg); } 100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: translate(20px,-15px) scale(1.05) rotate(180deg); } }
        .windows-loader, .error-text { position: relative; z-index: 1; }

        /* Windows开机动画容器 */
        .windows-loader {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 40px;
        }

        /* 旋转的Windows徽标 */
        .windows-logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #FFFFFF;
            border-top-color: #00ADEF;
            animation: spin 2s linear infinite;
            position: relative;
        }

        /* 徽标内部Windows四格样式 */
        .windows-logo::before,
        .windows-logo::after {
            content: "";
            position: absolute;
            background-color: #FFFFFF;
        }

        .windows-logo::before {
            width: 30px;
            height: 30px;
            top: 15px;
            left: 15px;
            border-right: 15px solid #00ADEF;
            border-bottom: 15px solid #00ADEF;
        }

        .windows-logo::after {
            width: 30px;
            height: 30px;
            bottom: 15px;
            right: 15px;
            border-left: 15px solid #00ADEF;
            border-top: 15px solid #00ADEF;
        }

        /* 旋转动画（仿Windows开机加载） */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 错误提示文本（仿Windows系统字体样式） */
        .error-text {
            color: #FFFFFF;
            text-align: center;
            line-height: 1.8;
        }

        .error-code {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .error-message {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .error-tip {
            font-size: 14px;
            opacity: 0.8;
        }

        /* 适配移动端 */
        @media (max-width: 768px) {
            .windows-loader {
                width: 80px;
                height: 80px;
            }

            .error-code {
                font-size: 36px;
            }

            .error-message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 动态极光流体背景 -->
    <div class="liquid-fluid-backdrop" aria-hidden="true">
        <div class="liquid-drop liquid-drop-1"></div>
        <div class="liquid-drop liquid-drop-2"></div>
        <div class="liquid-drop liquid-drop-3"></div>
    </div>
    <!-- Windows开机动画加载器 -->
    <div class="windows-loader">
        <div class="windows-logo"></div>
    </div>

    <!-- 错误提示文本 -->
    <div class="error-text">
        <div class="error-code">500</div>
        <div class="error-message">服务器内部错误</div>
        <div class="error-tip">
            系统正在重启服务，请稍候重试<br>
            若问题持续，请联系管理员
        </div>
    </div>
</body>
</html>
