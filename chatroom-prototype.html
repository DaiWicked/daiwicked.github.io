<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小小聊天 - ChatRoom 2.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1f3a 0%, #0d1025 50%, #1a1530 100%);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 壁纸背景 */
        .wallpaper {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0, 164, 239, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.25) 0%, transparent 50%),
                linear-gradient(135deg, #1a1f3a 0%, #0d1025 50%, #1a1530 100%);
            z-index: 0;
        }

        /* 主窗口 */
        .app-window {
            position: relative;
            z-index: 1;
            width: 880px;
            height: 620px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.25),
                inset 0 -1px 1px rgba(0, 0, 0, 0.1),
                0 24px 64px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 标题栏 */
        .titlebar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
            -webkit-app-region: drag;
        }
        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-icon {
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, #00a4ef, #0078d4);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0, 164, 239, 0.4);
        }
        .titlebar-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.95);
        }
        .titlebar-subtitle {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-left: 6px;
        }
        .titlebar-controls {
            display: flex;
            gap: 2px;
            -webkit-app-region: no-drag;
        }
        .win-btn {
            width: 34px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s ease;
            font-size: 13px;
        }
        .win-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .win-btn.close:hover {
            background: #e81123;
        }

        /* 主体 */
        .app-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧栏 */
        .sidebar {
            width: 260px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 12px;
            flex-shrink: 0;
        }
        .group-chat-btn {
            width: 100%;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(0, 164, 239, 0.85), rgba(0, 120, 212, 0.9));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 4px 12px rgba(0, 164, 239, 0.35);
        }
        .group-chat-btn:hover {
            transform: translateY(-1px);
            box-shadow: inset 0 1.5px 1.5px rgba(255,255,255,0.45), 0 6px 16px rgba(0, 164, 239, 0.5);
        }
        .group-chat-btn:active {
            transform: scale(0.97);
        }
        .group-chat-btn.active {
            background: linear-gradient(135deg, rgba(0, 164, 239, 0.95), rgba(0, 120, 212, 1));
        }

        .user-count {
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-top: 8px;
        }

        /* 用户列表 */
        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 12px;
        }
        .user-list::-webkit-scrollbar {
            width: 4px;
        }
        .user-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 2px;
            position: relative;
        }
        .user-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .user-item.active {
            background: rgba(0, 164, 239, 0.15);
            border: 1px solid rgba(0, 164, 239, 0.25);
        }
        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .user-avatar.online::after {
            content: '';
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 10px;
            height: 10px;
            background: #4cd137;
            border-radius: 50%;
            border: 2px solid rgba(20, 25, 40, 1);
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-ip {
            font-size: 10.5px;
            color: rgba(255,255,255,0.35);
            margin-top: 2px;
        }
        .user-unread {
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background: #ff4757;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
        }

        /* 侧栏底部GitHub按钮 */
        .sidebar-footer {
            padding: 10px 12px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .sidebar-github-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.12);
        }
        .sidebar-github-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: inset 0 1.5px 1.5px rgba(255,255,255,0.2), 0 4px 14px rgba(0, 0, 0, 0.25);
        }
        .sidebar-github-btn:active {
            transform: scale(0.97);
        }
        .sidebar-github-btn i {
            font-size: 17px;
        }

        /* 主聊天区 */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* 聊天头部 */
        .chat-header {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-title {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255,255,255,0.95);
        }
        .chat-subtitle {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-left: 8px;
        }
        .chat-header-actions {
            display: flex;
            gap: 2px;
        }
        .header-action-btn {
            width: 34px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: rgba(255,255,255,0.55);
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 14px;
        }
        .header-action-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }

        /* 消息区域 */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .messages-area::-webkit-scrollbar {
            width: 5px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        .date-divider {
            text-align: center;
            margin: 8px 0;
        }
        .date-divider span {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            background: rgba(0,0,0,0.2);
            padding: 3px 10px;
            border-radius: 10px;
        }
        .message {
            display: flex;
            gap: 8px;
            max-width: 75%;
            animation: msgIn 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message.received {
            align-self: flex-start;
        }
        .message.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
            margin-top: auto;
        }
        .msg-content {
            display: flex;
            flex-direction: column;
        }
        .msg-sender {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 3px;
            margin-left: 4px;
        }
        .msg-bubble {
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }
        .message.received .msg-bubble {
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-bottom-left-radius: 4px;
            color: rgba(255,255,255,0.95);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.15);
        }
        .message.sent .msg-bubble {
            background: linear-gradient(135deg, rgba(0, 164, 239, 0.85), rgba(0, 120, 212, 0.9));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom-right-radius: 4px;
            color: #fff;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3), 0 2px 8px rgba(0, 164, 239, 0.25);
        }
        .msg-time {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            margin-top: 3px;
            text-align: right;
            padding-right: 4px;
        }

        /* 系统消息 */
        .system-msg {
            align-self: center;
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            background: rgba(0,0,0,0.15);
            padding: 4px 12px;
            border-radius: 10px;
        }

        /* 输入区 */
        .compose-area {
            padding: 10px 14px 14px;
            flex-shrink: 0;
        }
        .compose-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 6px 6px 6px 10px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.15);
            transition: all 0.2s ease;
        }
        .compose-wrapper:focus-within {
            border-color: rgba(0, 164, 239, 0.4);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 0 0 3px rgba(0, 164, 239, 0.1);
        }
        .compose-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 13.5px;
            line-height: 1.5;
            resize: none;
            max-height: 100px;
            min-height: 24px;
            padding: 4px 0;
            font-family: inherit;
        }
        .compose-input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .compose-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .compose-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 7px;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }
        .compose-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: scale(1.1);
        }
        .send-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(0, 164, 239, 0.9), rgba(0, 120, 212, 0.95));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 3px 10px rgba(0, 164, 239, 0.4);
            font-size: 14px;
            flex-shrink: 0;
        }
        .send-btn:hover {
            transform: translateY(-1px) scale(1.08);
            box-shadow: inset 0 1.5px 1.5px rgba(255,255,255,0.45), 0 5px 16px rgba(0, 164, 239, 0.55);
        }
        .send-btn:active {
            transform: scale(0.92);
        }

        /* 表情面板 */
        .emoji-panel {
            position: absolute;
            bottom: 70px;
            left: 14px;
            width: 280px;
            background: rgba(30, 35, 55, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .emoji-panel.show {
            display: grid;
        }
        .emoji-item {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s ease;
        }
        .emoji-item:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div class="wallpaper"></div>

    <div class="app-window">
        <!-- 标题栏 -->
        <div class="titlebar">
            <div class="titlebar-left">
                <div class="app-icon">💬</div>
                <span class="titlebar-title">小小聊天</span>
                <span class="titlebar-subtitle">ChatRoom 2.0 · 局域网聊天室</span>
            </div>
            <div class="titlebar-controls">
                <a href="https://github.com/DaiWicked/ChatRoom2.0" target="_blank" class="win-btn github-btn" title="GitHub 项目" style="text-decoration:none; background: rgba(255, 255, 255, 0.08); color: rgba(255,255,255,0.85); width: auto; padding: 0 10px; gap: 5px; font-size: 12px; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.12);">
                    <i class="fa fa-github" style="font-size:15px;"></i> GitHub
                </a>
                <button class="win-btn" title="搜索" onclick="toggleSearch()"><i class="fa fa-search"></i></button>
                <button class="win-btn" title="设置"><i class="fa fa-cog"></i></button>
                <button class="win-btn close" title="关闭" onclick="window.location.href='./index.html'">✕</button>
            </div>
        </div>

        <!-- 主体 -->
        <div class="app-body">
            <!-- 左侧栏 -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <button class="group-chat-btn active" id="groupChatBtn" onclick="switchToGroup()">
                        <i class="fa fa-bullhorn"></i> 群聊广播
                    </button>
                    <div class="user-count" id="userCount">在线用户 (5)</div>
                </div>
                <div class="user-list" id="userList">
                    <!-- 由JS生成 -->
                </div>
                <div class="sidebar-footer">
                    <a href="https://github.com/DaiWicked/ChatRoom2.0" target="_blank" class="sidebar-github-btn">
                        <i class="fa fa-github"></i>
                        <span>GitHub 项目</span>
                    </a>
                </div>
            </div>

            <!-- 主聊天区 -->
            <div class="chat-main">
                <!-- 聊天头部 -->
                <div class="chat-header">
                    <div class="chat-header-left">
                        <span class="chat-title" id="chatTitle"># 群聊</span>
                        <span class="chat-subtitle" id="chatSubtitle">5 人在线</span>
                    </div>
                    <div class="chat-header-actions">
                        <button class="header-action-btn" title="清空聊天记录"><i class="fa fa-trash-o"></i></button>
                        <button class="header-action-btn" title="保存聊天记录"><i class="fa fa-save"></i></button>
                    </div>
                </div>

                <!-- 消息区域 -->
                <div class="messages-area" id="messagesArea">
                    <div class="date-divider"><span>今天</span></div>
                    <div class="system-msg">你已加入群聊，开始聊天吧！</div>
                </div>

                <!-- 输入区 -->
                <div class="compose-area" style="position: relative;">
                    <div class="emoji-panel" id="emojiPanel">
                        <!-- 表情由JS生成 -->
                    </div>
                    <div class="compose-wrapper">
                        <textarea class="compose-input" id="composeInput" placeholder="输入消息..." rows="1"></textarea>
                        <div class="compose-actions">
                            <button class="compose-btn" title="表情" onclick="toggleEmoji()"><i class="fa fa-smile-o"></i></button>
                            <button class="compose-btn" title="图片/文件"><i class="fa fa-paperclip"></i></button>
                            <button class="send-btn" id="sendBtn" title="发送" onclick="sendMessage()"><i class="fa fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 用户数据
        const users = [
            { id: 1, name: 'WickedDai', ip: '192.168.1.101', color: 'linear-gradient(135deg, #667eea, #764ba2)', online: true, unread: 0 },
            { id: 2, name: '林先生', ip: '192.168.1.102', color: 'linear-gradient(135deg, #4facfe, #00f2fe)', online: true, unread: 2 },
            { id: 3, name: 'JacksonHuang', ip: '192.168.1.103', color: 'linear-gradient(135deg, #43e97b, #38f9d7)', online: true, unread: 0 },
            { id: 4, name: '贝贝南瓜', ip: '192.168.1.104', color: 'linear-gradient(135deg, #fa709a, #fee140)', online: false, unread: 0 },
            { id: 5, name: '一颗小兔娘', ip: '192.168.1.105', color: 'linear-gradient(135deg, #a8edea, #fed6e3)', online: true, unread: 0 },
        ];

        // 群聊消息
        const groupMessages = [
            { type: 'received', sender: 'WickedDai', avatar: 'W', color: 'linear-gradient(135deg, #667eea, #764ba2)', text: '大家好，今天机房网速不错啊', time: '14:20' },
            { type: 'received', sender: '林先生', avatar: '林', color: 'linear-gradient(135deg, #4facfe, #00f2fe)', text: '是啊，刚才传了几张照片都秒发', time: '14:22' },
            { type: 'sent', text: 'ChatRoom 2.0 这个局域网聊天确实方便，不用连外网', time: '14:25' },
            { type: 'received', sender: 'JacksonHuang', avatar: 'J', color: 'linear-gradient(135deg, #43e97b, #38f9d7)', text: '零部署零账号，双击就能用，太爽了', time: '14:28' },
        ];

        // 私聊消息（按用户id存储）
        const privateMessages = {
            2: [
                { type: 'received', sender: '林先生', avatar: '林', color: 'linear-gradient(135deg, #4facfe, #00f2fe)', text: '在吗？帮我看看这张照片', time: '13:50' },
                { type: 'sent', text: '在的，发我看看', time: '13:52' },
                { type: 'received', sender: '林先生', avatar: '林', color: 'linear-gradient(135deg, #4facfe, #00f2fe)', text: '就是这张，你觉得构图怎么样？', time: '13:55' },
            ],
        };

        let currentChat = { type: 'group' }; // { type: 'group' } 或 { type: 'private', userId: 2 }

        // 渲染用户列表
        function renderUserList() {
            const list = document.getElementById('userList');
            list.innerHTML = users.map(user => `
                <div class="user-item ${currentChat.type === 'private' && currentChat.userId === user.id ? 'active' : ''}" onclick="switchToPrivate(${user.id})">
                    <div class="user-avatar ${user.online ? 'online' : ''}" style="background: ${user.color};">
                        ${user.name.charAt(0)}
                    </div>
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-ip">${user.ip}</div>
                    </div>
                    ${user.unread > 0 ? `<div class="user-unread">${user.unread}</div>` : ''}
                </div>
            `).join('');
            document.getElementById('userCount').textContent = `在线用户 (${users.filter(u => u.online).length})`;
        }

        // 切换到群聊
        function switchToGroup() {
            currentChat = { type: 'group' };
            document.getElementById('groupChatBtn').classList.add('active');
            document.getElementById('chatTitle').textContent = '# 群聊';
            document.getElementById('chatSubtitle').textContent = `${users.filter(u => u.online).length} 人在线`;
            renderUserList();
            renderMessages();
        }

        // 切换到私聊
        function switchToPrivate(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;
            currentChat = { type: 'private', userId: userId };
            user.unread = 0; // 清除未读
            document.getElementById('groupChatBtn').classList.remove('active');
            document.getElementById('chatTitle').textContent = user.name;
            document.getElementById('chatSubtitle').textContent = user.online ? '在线' : '离线';
            renderUserList();
            renderMessages();
        }

        // 渲染消息
        function renderMessages() {
            const area = document.getElementById('messagesArea');
            let messages;
            if (currentChat.type === 'group') {
                messages = groupMessages;
            } else {
                messages = privateMessages[currentChat.userId] || [];
            }

            area.innerHTML = `
                <div class="date-divider"><span>今天</span></div>
                ${messages.map(msg => {
                    if (msg.type === 'system') {
                        return `<div class="system-msg">${msg.text}</div>`;
                    }
                    return `
                        <div class="message ${msg.type}">
                            ${msg.type === 'received' ? `<div class="msg-avatar" style="background: ${msg.color};">${msg.avatar}</div>` : ''}
                            <div class="msg-content">
                                ${msg.type === 'received' && msg.sender ? `<div class="msg-sender">${msg.sender}</div>` : ''}
                                <div class="msg-bubble">
                                    ${msg.text}
                                    <div class="msg-time">${msg.time}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')}
            `;
            area.scrollTop = area.scrollHeight;
        }

        // 发送消息
        function sendMessage() {
            const input = document.getElementById('composeInput');
            const text = input.value.trim();
            if (!text) return;

            const now = new Date();
            const time = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const msg = { type: 'sent', text, time };

            if (currentChat.type === 'group') {
                groupMessages.push(msg);
            } else {
                if (!privateMessages[currentChat.userId]) privateMessages[currentChat.userId] = [];
                privateMessages[currentChat.userId].push(msg);
            }

            input.value = '';
            input.style.height = 'auto';
            renderMessages();
        }

        // 表情面板
        const emojis = ['😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊','😋','😎','😍','😘','🥰','😗','😙','😚','🙂','🤗','🤩','🤔','🤨','😐','😑','😶','🙄','😏','😣','😥','😮','🤐','😯','😪','😫','🥱','😴','😌','😛','😜','😝','🤤','😒','😓','😔','😕','🙃','🤑','😲','☹️','🙁','😖','😞','😟','😤','😢','😭','😦','😧','😨','😩','🤯','😬','😰','😱','🥵','🥶','😳','🤪','😵','🥴','😠','😡','🤬','😷','🤒','🤕','🤢','🤮','🥳','🥺','🤠','🤡','🤫','🤭','🧐','🤓','😈','👿','👹','👺','💀','👻','👽','🤖','💩','😺','😸','😹','😻','😼','😽','🙀','😿','😾'];

        function renderEmojiPanel() {
            const panel = document.getElementById('emojiPanel');
            panel.innerHTML = emojis.map(e => `<div class="emoji-item" onclick="insertEmoji('${e}')">${e}</div>`).join('');
        }

        function toggleEmoji() {
            document.getElementById('emojiPanel').classList.toggle('show');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('composeInput');
            input.value += emoji;
            input.focus();
        }

        // 搜索（演示）
        function toggleSearch() {
            alert('搜索功能演示：可搜索聊天记录和用户');
        }

        // 输入框回车发送
        document.getElementById('composeInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 输入框自动高度
        document.getElementById('composeInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // 点击外部关闭表情面板
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('emojiPanel');
            const emojiBtn = e.target.closest('.compose-btn');
            if (!panel.contains(e.target) && !emojiBtn) {
                panel.classList.remove('show');
            }
        });

        // 初始化
        renderUserList();
        renderMessages();
        renderEmojiPanel();
    </script>

</body>
</html>
