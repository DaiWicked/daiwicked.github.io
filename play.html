<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="stylesheet" href="global-animations.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            /* 与 videos.html 统一背景风格，可共用同一张背景图 */
            background: url("./images/bg.jpg") no-repeat center center fixed;
            background-size: cover;
            position: relative;
            min-height: 100vh;
            color: #fff;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(66, 133, 244, 0.7), rgba(156, 39, 176, 0.7));
            z-index: -1;
        }

        /* 顶部导航栏 - 玻璃模糊 */
        .header {
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* 播放容器 - 玻璃模糊 + 居中 */
        .play-container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
        }

        /* 视频播放区域 - 响应式 */
        .video-player {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            background: #000;
            overflow: hidden;
            margin-bottom: 15px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* 强制禁止自动播放 */
            autoplay: false;
            preload: metadata;
        }

        /* 视频信息 */
        .video-info {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }

        .video-info h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .video-info p {
            color: #ddd;
            font-size: 14px;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(90deg, #ff4081, #673ab7);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
        }

        /* 底部返回按钮 */
        .footer {
            width: 100%;
            padding: 20px 0;
            position: fixed;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
        }

        .back-btn {
            padding: 10px 30px;
            background: linear-gradient(90deg, #ff4081, #673ab7);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .play-container {
                width: 95%;
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>视频播放平台</h1>
    </div>

    <div class="play-container">
        <div class="video-player">
            <!-- 视频路径：从URL参数获取，默认示例视频 -->
            <video controls id="videoPlayer" poster="../video/default_thumb.jpg">
                <source src="../video/default.mp4" type="video/mp4">
                您的浏览器不支持HTML5视频播放，请升级浏览器
            </video>
        </div>

        <div class="video-info">
            <h2 id="videoTitle">视频标题</h2>
            <p id="videoPath">视频路径：</p>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="window.history.back()">返回上一页</button>
            <button class="btn" onclick="document.getElementById('videoPlayer').play()">播放</button>
            <button class="btn" onclick="document.getElementById('videoPlayer').pause()">暂停</button>
        </div>
    </div>

    <div class="footer">
        <button class="back-btn" onclick="window.location.href='./index.html'">返回主界面</button>
    </div>

    <script>
        // 从URL参数获取视频文件名和标题
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoName = urlParams.get('video') || 'default.mp4';
            const videoTitle = urlParams.get('title') || '默认视频';
            const videoSrc = `./video/${videoName}`;

            // 设置视频源和标题
            const videoPlayer = document.getElementById('videoPlayer');
            const source = videoPlayer.querySelector('source');
            source.src = videoSrc;
            videoPlayer.load();

            document.getElementById('videoTitle').innerText = videoTitle;
            document.getElementById('videoPath').innerText = `视频路径：${videoName}`;
        }
    </script>
</body>
</html>
