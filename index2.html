<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缺德组织 - 作品展示</title>
    <!-- 可修改title标签内容，改为自定义的子页面标题 -->
    <style>
        /* 全局样式 - 可修改背景色、字体等 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        /* 背景容器 - 核心：自定义背景图片+模糊效果 */
        .bg-container {
            position: fixed; /* 背景固定，滚动页面不移动 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 放在内容下方 */
            background-image: url("bg.jpg"); /* 自定义背景图片路径，可修改为你的图片（如images/bg.png） */
            background-size: cover; /* 背景图片铺满屏幕，可选contain/100% 100%等 */
            background-position: center; /* 背景图片居中显示 */
            filter: blur(8px); /* 背景模糊度，数值越大越模糊，可修改 */
            -webkit-filter: blur(8px); /* 兼容webkit内核浏览器 */
        }
        /* 主体内容容器 - 毛玻璃效果核心 */
        body {
            color: #fff;
            padding: 20px;
            margin-top: 30px; /* 无导航栏，增加顶部边距优化视觉 */
            position: relative; /* 让内容在背景上方 */
        }
        /* 页面标题样式 - 可修改字体大小、颜色，加半透明背景增强可读性 */
        .page-title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(0, 0, 0, 0.3); /* 半透明背景，增强文字可读性 */
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }
        /* 作品板块容器 - 可修改宽度、间距 */
        .works-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative; /* 确保在背景上方 */
        }
        /* 单个板块样式 - 毛玻璃效果核心，可修改模糊度、背景透明度 */
        .work-section {
            width: 45%;
            /* 毛玻璃样式 */
            background: rgba(44, 62, 80, 0.6); /* 背景半透明，可修改rgba最后一位调整透明度 */
            backdrop-filter: blur(10px); /* 板块毛玻璃模糊度，可修改 */
            -webkit-backdrop-filter: blur(10px); /* 兼容webkit内核 */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.1); /* 加细边框增强毛玻璃质感 */
            position: relative; /* 确保层级 */
        }
        /* 板块标题样式 - 可修改字体大小、下划线样式 */
        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #1E88E5;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        /* 作品展示容器 - 可修改排版方式 */
        .work-item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        /* 作品项样式 - 可修改宽度、边框、圆角，也可加毛玻璃效果 */
        .work-item {
            width: 30%;
            border: 2px solid rgba(255, 255, 255, 0.2); /* 半透明白边，适配毛玻璃 */
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2); /* 作品项轻微半透明 */
        }
        /* 作品图片样式 - 可修改高度、适配方式 */
        .work-item img {
            width: 100%;
            height: 150px; /* 图片高度，可修改 */
            object-fit: cover; /* 图片适配方式，可选cover/contain等 */
            display: block;
            opacity: 0.9; /* 图片轻微透明，融合毛玻璃风格 */
        }
        /* 作品描述样式 - 可修改字体大小、内边距 */
        .work-desc {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        /* 返回首页按钮 - 毛玻璃样式，可修改颜色、大小 */
        .back-home {
            display: block;
            width: 120px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            /* 按钮毛玻璃 */
            background: rgba(44, 62, 80, 0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin: 40px auto 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative; /* 确保层级 */
        }
        .back-home:hover {
            background: #1E88E5; /* 鼠标悬浮色，可修改 */
        }

        /* 响应式适配 - 小屏幕下板块占满宽度，可修改断点和样式 */
        @media (max-width: 768px) {
            .work-section {
                width: 100%;
            }
            .work-item {
                width: 45%;
            }
            .bg-container {
                filter: blur(4px); /* 小屏幕降低背景模糊度，提升性能 */
                -webkit-filter: blur(4px);
            }
        }
    </style>
</head>
