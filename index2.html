<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缺德组织 - 作品展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* ========== 全局基础 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #070a13;
            color: rgba(255, 255, 255, 0.92);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        }

        /* ========== 动态极光流体背景 ========== */
        .liquid-fluid-backdrop {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
            overflow: hidden;
            animation: auroraHueCycle 28s infinite ease-in-out alternate;
        }
        @keyframes auroraHueCycle {
            0% { filter: hue-rotate(0deg) saturate(100%); }
            33% { filter: hue-rotate(35deg) saturate(115%); }
            66% { filter: hue-rotate(-30deg) saturate(110%); }
            100% { filter: hue-rotate(45deg) saturate(105%); }
        }
        .liquid-drop {
            position: absolute;
            filter: blur(85px);
            opacity: 0.38;
            mix-blend-mode: screen;
            animation: liquidMorph 18s infinite ease-in-out alternate;
        }
        .liquid-drop-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #0284c7 15%, #0369a1 45%, transparent 70%);
            top: -10%; left: 2%;
            animation-duration: 18s;
        }
        .liquid-drop-2 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, #0d9488 10%, #2563eb 50%, transparent 70%);
            top: 38%; right: -6%;
            animation-duration: 24s;
            animation-delay: -6s;
        }
        .liquid-drop-3 {
            width: 480px; height: 480px;
            background: radial-gradient(circle, #6366f1 15%, #1d4ed8 50%, transparent 70%);
            bottom: -5%; left: 22%;
            animation-duration: 21s;
            animation-delay: -11s;
        }
        @keyframes liquidMorph {
            0% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: translate(0,0) scale(1) rotate(0deg); }
            33% { border-radius: 70% 30% 46% 54% / 30% 60% 40% 70%; transform: translate(45px,-35px) scale(1.1) rotate(60deg); }
            66% { border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; transform: translate(-30px,45px) scale(0.95) rotate(120deg); }
            100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: translate(20px,-15px) scale(1.05) rotate(180deg); }
        }

        /* ========== 液态玻璃卡片 ========== */
        .glass-card {
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(28px) saturate(190%) brightness(1.08);
            -webkit-backdrop-filter: blur(28px) saturate(190%) brightness(1.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.25rem;
            position: relative;
            overflow: hidden;
            box-shadow:
                inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.25),
                0 16px 36px -10px rgba(0, 0, 0, 0.55),
                0 0 24px -4px rgba(56, 189, 248, 0.1);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .glass-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 40%, rgba(56,189,248,0.08) 75%, transparent 100%);
            pointer-events: none; z-index: 1;
            opacity: 0.65; transition: opacity 0.4s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px) scale(1.008);
            background: rgba(255, 255, 255, 0.075);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow:
                inset 0 2px 1.5px 0 rgba(255, 255, 255, 0.55),
                inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.3),
                0 24px 48px -12px rgba(0, 0, 0, 0.65),
                0 0 35px 2px rgba(56, 189, 248, 0.22);
        }
        .glass-card:hover::before { opacity: 1; }
        .glass-card > * { position: relative; z-index: 2; }

        /* ========== 胶囊形悬浮导航栏 ========== */
        .liquid-navbar {
            background: rgba(10, 15, 26, 0.28);
            backdrop-filter: blur(14px) saturate(200%) brightness(1.1);
            -webkit-backdrop-filter: blur(14px) saturate(200%) brightness(1.1);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 9999px;
            box-shadow: inset 0 1.5px 1px 0 rgba(255,255,255,0.4), 0 12px 28px -4px rgba(0,0,0,0.35);
        }
        .nav-link {
            color: rgba(209, 213, 219, 0.8);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-link:hover { color: #38bdf8; }

        /* ========== 渐变文字 ========== */
        .text-liquid-shimmer {
            background: linear-gradient(135deg, #ffffff 15%, #7dd3fc 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ========== 英文标签 ========== */
        .section-label {
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* ========== 作品项 ========== */
        .work-item {
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .work-item:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.15);
        }
        .work-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        .work-desc {
            padding: 0.625rem;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ========== 水凝胶按钮 ========== */
        .liquid-btn {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.8), rgba(2, 132, 199, 0.88));
            backdrop-filter: blur(16px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 0.75rem;
            color: white;
            text-decoration: none;
            font-weight: 600;
            box-shadow: inset 0 1.5px 1px 0 rgba(255,255,255,0.45), 0 8px 24px -4px rgba(2,132,199,0.45);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .liquid-btn:hover {
            transform: translateY(-2px) scale(1.02);
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.95), rgba(2, 132, 199, 0.98));
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 2px 0 rgba(255,255,255,0.65), 0 12px 28px -2px rgba(2,132,199,0.65);
        }
        .liquid-btn:active { transform: scale(0.97); transition: transform 0.1s; }

        /* ========== 滚动渐显 ========== */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <!-- 动态极光流体背景 -->
    <div class="liquid-fluid-backdrop" aria-hidden="true">
        <div class="liquid-drop liquid-drop-1"></div>
        <div class="liquid-drop liquid-drop-2"></div>
        <div class="liquid-drop liquid-drop-3"></div>
    </div>

    <!-- Hero 标题区 -->
    <section class="pt-16 pb-12 relative z-10">
        <div class="container mx-auto px-6 max-w-4xl text-center fade-in">
            <span class="section-label">Portfolio</span>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mt-2 mb-3">
                <span class="text-liquid-shimmer">缺德组织 · 作品展示</span>
            </h1>
            <p class="text-gray-400 text-sm md:text-base font-light">摄影样片 · 原创漫画</p>
        </div>
    </section>

    <!-- 摄影样片 -->
    <section id="photo" class="py-12 relative z-10">
        <div class="container mx-auto px-6 max-w-6xl">
            <div class="mb-8 fade-in">
                <span class="section-label">Photography</span>
                <h2 class="text-2xl font-bold text-white mt-1">摄影样片</h2>
            </div>
            <div class="glass-card p-6 fade-in">
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-3 gap-4">
                    <div class="work-item">
                        <img src="photo1.jpg" alt="摄影样片1">
                        <p class="work-desc">By WickedDai</p>
                    </div>
                    <div class="work-item">
                        <img src="photo2.jpg" alt="摄影样片2">
                        <p class="work-desc">By WickedDai</p>
                    </div>
                    <div class="work-item">
                        <img src="photo3.jpg" alt="摄影样片3">
                        <p class="work-desc">By WickedDai</p>
                    </div>
                    <div class="work-item">
                        <img src="photo4.jpg" alt="摄影样片4">
                        <p class="work-desc">By Mr.Lin</p>
                    </div>
                    <div class="work-item">
                        <img src="photo5.jpg" alt="摄影样片5">
                        <p class="work-desc">By Mr.Lin</p>
                    </div>
                    <div class="work-item">
                        <img src="photo6.jpg" alt="摄影样片6">
                        <p class="work-desc">By Mr.Lin</p>
                    </div>
                    <div class="work-item">
                        <img src="photo7.jpg" alt="摄影样片7">
                        <p class="work-desc">By JacksonHuang</p>
                    </div>
                    <div class="work-item">
                        <img src="photo8.jpg" alt="摄影样片8">
                        <p class="work-desc">By JacksonHuang</p>
                    </div>
                    <div class="work-item">
                        <img src="photo9.jpg" alt="摄影样片9">
                        <p class="work-desc">By JacksonHuang</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 原创漫画 -->
    <section id="comic" class="py-12 relative z-10">
        <div class="container mx-auto px-6 max-w-6xl">
            <div class="mb-8 fade-in">
                <span class="section-label">Comics</span>
                <h2 class="text-2xl font-bold text-white mt-1">原创漫画</h2>
            </div>
            <div class="glass-card p-6 fade-in">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 max-w-4xl">
                    <div class="work-item">
                        <img src="comic1.jpg" alt="原创漫画1">
                        <p class="work-desc">流浪壮根1（2023.11）</p>
                    </div>
                    <div class="work-item">
                        <img src="comic2.jpg" alt="原创漫画2">
                        <p class="work-desc">流浪壮根（2023.11）</p>
                    </div>
                    <div class="work-item">
                        <img src="comic3.jpg" alt="原创漫画3">
                        <p class="work-desc">流浪壮根3（未完待续）</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 返回首页 -->
    <section class="py-16 relative z-10">
        <div class="container mx-auto px-6 text-center fade-in">
            <a href="./index.html" class="liquid-btn px-8 py-3.5 text-base">
                <i class="fa fa-home"></i>返回首页
            </a>
        </div>
    </section>

    <!-- 滚动渐显 JS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        });
    </script>

</body>
</html>
