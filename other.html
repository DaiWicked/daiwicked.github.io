<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特殊嘉宾</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #070a13;
            color: rgba(255, 255, 255, 0.92);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        }

        /* 动态极光流体背景 */
        .liquid-fluid-backdrop {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
            overflow: hidden;
            animation: auroraHueCycle 28s infinite ease-in-out alternate;
        }
        @keyframes auroraHueCycle {
            0% { filter: hue-rotate(0deg) saturate(100%); }
            33% { filter: hue-rotate(35deg) saturate(115%); }
            66% { filter: hue-rotate(-30deg) saturate(110%); }
            100% { filter: hue-rotate(45deg) saturate(105%); }
        }
        .liquid-drop {
            position: absolute;
            filter: blur(85px);
            opacity: 0.38;
            mix-blend-mode: screen;
            animation: liquidMorph 18s infinite ease-in-out alternate;
        }
        .liquid-drop-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #0284c7 15%, #0369a1 45%, transparent 70%);
            top: -10%; left: 2%;
            animation-duration: 18s;
        }
        .liquid-drop-2 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, #0d9488 10%, #2563eb 50%, transparent 70%);
            top: 38%; right: -6%;
            animation-duration: 24s;
            animation-delay: -6s;
        }
        .liquid-drop-3 {
            width: 480px; height: 480px;
            background: radial-gradient(circle, #6366f1 15%, #1d4ed8 50%, transparent 70%);
            bottom: -5%; left: 22%;
            animation-duration: 21s;
            animation-delay: -11s;
        }
        @keyframes liquidMorph {
            0% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: translate(0,0) scale(1) rotate(0deg); }
            33% { border-radius: 70% 30% 46% 54% / 30% 60% 40% 70%; transform: translate(45px,-35px) scale(1.1) rotate(60deg); }
            66% { border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; transform: translate(-30px,45px) scale(0.95) rotate(120deg); }
            100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: translate(20px,-15px) scale(1.05) rotate(180deg); }
        }

        /* 液态玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(28px) saturate(190%) brightness(1.08);
            -webkit-backdrop-filter: blur(28px) saturate(190%) brightness(1.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.25rem;
            position: relative;
            overflow: hidden;
            box-shadow:
                inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.25),
                0 16px 36px -10px rgba(0, 0, 0, 0.55),
                0 0 24px -4px rgba(56, 189, 248, 0.1);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .glass-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 40%, rgba(56,189,248,0.08) 75%, transparent 100%);
            pointer-events: none; z-index: 1;
            opacity: 0.65; transition: opacity 0.4s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px) scale(1.008);
            background: rgba(255, 255, 255, 0.075);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow:
                inset 0 2px 1.5px 0 rgba(255, 255, 255, 0.55),
                inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.3),
                0 24px 48px -12px rgba(0, 0, 0, 0.65),
                0 0 35px 2px rgba(56, 189, 248, 0.22);
        }
        .glass-card:hover::before { opacity: 1; }
        .glass-card > * { position: relative; z-index: 2; }

        /* 胶囊形悬浮导航栏 */
        .liquid-navbar {
            background: rgba(10, 15, 26, 0.28);
            backdrop-filter: blur(14px) saturate(200%) brightness(1.1);
            -webkit-backdrop-filter: blur(14px) saturate(200%) brightness(1.1);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 9999px;
            box-shadow: inset 0 1.5px 1px 0 rgba(255,255,255,0.4), 0 12px 28px -4px rgba(0,0,0,0.35);
        }
        .nav-link {
            color: rgba(209, 213, 219, 0.8);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-link:hover { color: #38bdf8; }

        /* 渐变文字 */
        .text-liquid-shimmer {
            background: linear-gradient(135deg, #ffffff 15%, #7dd3fc 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 英文标签 */
        .section-label {
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* 水凝胶按钮 */
        .liquid-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.8), rgba(2, 132, 199, 0.88));
            backdrop-filter: blur(16px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 9999px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            box-shadow: inset 0 1.5px 1px 0 rgba(255,255,255,0.45), 0 8px 24px -4px rgba(2,132,199,0.45);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .liquid-btn > * { position: relative; z-index: 2; }
        .liquid-btn::after {
            content: '';
            position: absolute;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            transform: translate(-50%, -50%);
            left: var(--mouse-x, 50%);
            top: var(--mouse-y, 50%);
            z-index: 1;
        }
        .liquid-btn:hover::after { opacity: 1; }
        .liquid-btn:hover {
            transform: translateY(-2px) scale(1.02);
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.95), rgba(2, 132, 199, 0.98));
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 2px 0 rgba(255,255,255,0.65), 0 12px 28px -2px rgba(2,132,199,0.65);
        }
        .liquid-btn:active {
            transform: scale(0.96);
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                inset 0 4px 8px rgba(0,0,0,0.25),
                inset 0 -2px 4px rgba(255,255,255,0.15),
                inset 0 0 0 1.5px rgba(255,255,255,0.35),
                0 2px 6px rgba(0,0,0,0.2);
        }

        /* 滚动渐显 */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* 内容样式 */
        .content-wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* 个人介绍板块 */
        .intro-section {
            display: flex;
            margin-bottom: 30px;
            overflow: hidden;
            min-height: 450px;
        }
        .info-col {
            width: 200px;
            flex-shrink: 0;
            padding: 30px 0;
            background: linear-gradient(180deg, rgba(74, 108, 247, 0.5) 0%, rgba(45, 70, 185, 0.5) 100%);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            text-align: center;
        }
        .info-item {
            margin: 16px 0;
            width: 100%;
            padding: 0 16px;
        }
        .info-item h2 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.95);
        }
        .info-item p {
            font-size: 0.85rem;
            opacity: 0.85;
            line-height: 1.6;
        }
        .img-col {
            flex: 1;
            min-height: 450px;
        }
        .img-col img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 个人风采 */
        .style-section {
            padding: 30px;
            margin-bottom: 30px;
        }
        .style-title {
            text-align: center;
            color: rgba(255,255,255,0.95);
            font-size: 1.5rem;
            margin-bottom: 24px;
            letter-spacing: 3px;
        }
        .style-photos {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .photo-item {
            flex: 1;
            min-width: 260px;
            height: 280px;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .photo-item:hover {
            transform: scale(1.03);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 12px 28px rgba(0,0,0,0.4), 0 0 20px rgba(56,189,248,0.15);
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 音乐区 */
        .music-section {
            padding: 24px;
            margin-bottom: 30px;
            text-align: center;
        }
        .music-section h2 {
            color: rgba(255,255,255,0.95);
            font-size: 1.5rem;
            margin-bottom: 8px;
            letter-spacing: 3px;
        }
        .music-section p {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .music-section audio {
            width: 100%;
            max-width: 500px;
            border-radius: 0.5rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .intro-section {
                flex-direction: column;
                min-height: auto;
            }
            .info-col {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                padding: 20px 0;
            }
            .info-item {
                width: auto;
                margin: 8px;
            }
            .img-col {
                min-height: 300px;
            }
        }

        /* focus-visible 键盘焦点环 */
        .liquid-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.8),
                        0 0 0 5px rgba(56, 189, 248, 0.25),
                        0 0 16px rgba(56, 189, 248, 0.5) !important;
        }
    </style>
</head>
<body>

    <!-- 动态极光流体背景 -->
    <div class="liquid-fluid-backdrop" aria-hidden="true">
        <div class="liquid-drop liquid-drop-1"></div>
        <div class="liquid-drop liquid-drop-2"></div>
        <div class="liquid-drop liquid-drop-3"></div>
    </div>

    <!-- 主内容区 -->
    <main class="pt-16 pb-16 relative z-10">
        <div class="content-wrap">

            <!-- 标题 -->
            <div class="text-center mb-10 fade-in">
                <span class="section-label">Special Guest</span>
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mt-2 mb-3">
                    <span class="text-liquid-shimmer">特殊嘉宾</span>
                </h1>
            </div>

            <!-- 个人介绍板块 -->
            <section class="intro-section glass-card fade-in">
                <div class="info-col">
                    <div class="info-item">
                        <h2>姓名</h2>
                        <p>黄智程</p>
                        <p>就是个鸡吧</p>
                    </div>
                    <div class="info-item">
                        <h2>联系电话</h2>
                        <p>150****4172</p>
                    </div>
                    <div class="info-item">
                        <h2>使用设备</h2>
                        <p>iQOO Neo10</p>
                    </div>
                    <div class="info-item">
                        <h2>爱好</h2>
                        <p>撸管，养鸡，看片</p>
                    </div>
                    <div class="info-item">
                        <h2>奖项</h2>
                        <p>福建省撸管大赛第一名</p>
                        <p>吉尼斯撸管记录保持者</p>
                    </div>
                </div>
                <div class="img-col">
                    <img src="./other.jpg" alt="主图">
                </div>
            </section>

            <!-- 个人风采 -->
            <section class="style-section glass-card fade-in">
                <h2 class="style-title">个人风采</h2>
                <div class="style-photos">
                    <div class="photo-item">
                        <img src="./other1.jpg" alt="照片1">
                    </div>
                    <div class="photo-item">
                        <img src="./other2.jpg" alt="照片2">
                    </div>
                    <div class="photo-item">
                        <img src="./other3.jpg" alt="照片3">
                    </div>
                </div>
            </section>

            <!-- IQOO 音乐 -->
            <section class="music-section glass-card fade-in">
                <h2>IQOO</h2>
                <p>年少有为用爱酷，游戏永远不会输</p>
                <audio controls autoplay loop>
                    <source src="./iqoo.mp3" type="audio/mpeg">
                    您的浏览器不支持音频播放功能
                </audio>
            </section>

            <!-- 返回首页 -->
            <div class="text-center mt-10 fade-in">
                <a href="./index.html" class="liquid-btn px-8 py-3 text-base">
                    <i class="fa fa-home"></i>返回首页
                </a>
            </div>

        </div>
    </main>

    <!-- 滚动渐显 JS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

            // 按钮光标跟随高光
            document.querySelectorAll('.liquid-btn').forEach(btn => {
                btn.addEventListener('mousemove', (e) => {
                    const rect = btn.getBoundingClientRect();
                    btn.style.setProperty('--mouse-x', (e.clientX - rect.left) + 'px');
                    btn.style.setProperty('--mouse-y', (e.clientY - rect.top) + 'px');
                });
            });
        });
    </script>

</body>
</html>
