<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小彩蛋</title>
    <link rel="stylesheet" href="./global-animations.css">
    <style>
        /* ========== 全局基础 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #070a13;
            color: rgba(255, 255, 255, 0.92);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        }

        /* ========== 动态极光流体背景 ========== */
        .liquid-fluid-backdrop {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
            overflow: hidden;
            animation: auroraHueCycle 28s infinite ease-in-out alternate;
        }
        @keyframes auroraHueCycle {
            0% { filter: hue-rotate(0deg) saturate(100%); }
            33% { filter: hue-rotate(35deg) saturate(115%); }
            66% { filter: hue-rotate(-30deg) saturate(110%); }
            100% { filter: hue-rotate(45deg) saturate(105%); }
        }
        .liquid-drop {
            position: absolute;
            filter: blur(85px);
            opacity: 0.38;
            mix-blend-mode: screen;
            animation: liquidMorph 18s infinite ease-in-out alternate;
        }
        .liquid-drop-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #0284c7 15%, #0369a1 45%, transparent 70%);
            top: -10%; left: 2%;
            animation-duration: 18s;
        }
        .liquid-drop-2 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, #0d9488 10%, #2563eb 50%, transparent 70%);
            top: 38%; right: -6%;
            animation-duration: 24s;
            animation-delay: -6s;
        }
        .liquid-drop-3 {
            width: 480px; height: 480px;
            background: radial-gradient(circle, #6366f1 15%, #1d4ed8 50%, transparent 70%);
            bottom: -5%; left: 22%;
            animation-duration: 21s;
            animation-delay: -11s;
        }
        @keyframes liquidMorph {
            0% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: translate(0,0) scale(1) rotate(0deg); }
            33% { border-radius: 70% 30% 46% 54% / 30% 60% 40% 70%; transform: translate(45px,-35px) scale(1.1) rotate(60deg); }
            66% { border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; transform: translate(-30px,45px) scale(0.95) rotate(120deg); }
            100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: translate(20px,-15px) scale(1.05) rotate(180deg); }
        }

        /* ========== 液态玻璃卡片 ========== */
        .glass-card {
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(28px) saturate(190%) brightness(1.08);
            -webkit-backdrop-filter: blur(28px) saturate(190%) brightness(1.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.25rem;
            position: relative;
            overflow: hidden;
            box-shadow:
                inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.25),
                0 16px 36px -10px rgba(0, 0, 0, 0.55),
                0 0 24px -4px rgba(56, 189, 248, 0.1);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .glass-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 40%, rgba(56,189,248,0.08) 75%, transparent 100%);
            pointer-events: none; z-index: 1;
            opacity: 0.65; transition: opacity 0.4s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px) scale(1.008);
            background: rgba(255, 255, 255, 0.075);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow:
                inset 0 2px 1.5px 0 rgba(255, 255, 255, 0.55),
                inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.3),
                0 24px 48px -12px rgba(0, 0, 0, 0.65),
                0 0 35px 2px rgba(56, 189, 248, 0.22);
        }
        .glass-card:hover::before { opacity: 1; }
        .glass-card > * { position: relative; z-index: 2; }

        /* ========== 胶囊形悬浮导航栏 ========== */
        .liquid-navbar {
            background: rgba(10, 15, 26, 0.28);
            backdrop-filter: blur(14px) saturate(200%) brightness(1.1);
            -webkit-backdrop-filter: blur(14px) saturate(200%) brightness(1.1);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 9999px;
            box-shadow: inset 0 1.5px 1px 0 rgba(255,255,255,0.4), 0 12px 28px -4px rgba(0,0,0,0.35);
        }
        .nav-link {
            color: rgba(209, 213, 219, 0.8);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-link:hover { color: #38bdf8; }

        /* ========== 渐变文字 ========== */
        .text-liquid-shimmer {
            background: linear-gradient(135deg, #ffffff 15%, #7dd3fc 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ========== 英文标签 ========== */
        .section-label {
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* ========== 人物模板 ========== */
        .person-template {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
            display: flex;
            overflow: hidden;
            min-height: 500px;
        }
        /* 女生模板配色：柔和粉紫调 */
        .female-template .name-sidebar {
            background: linear-gradient(180deg, rgba(232, 196, 233, 0.6) 10%, rgba(212, 167, 214, 0.6) 100%);
        }
        /* 男生模板配色：沉稳蓝灰调 */
        .male-template .name-sidebar {
            background: linear-gradient(180deg, rgba(30, 136, 229, 0.6) 10%, rgba(143, 179, 210, 0.6) 100%);
        }
        /* 蔡徐坤模板配色：帅气黑紫色 */
        .caixukun-template .name-sidebar {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 10%, rgba(89, 0, 255, 0.6) 100%);
        }
        /* 左侧竖排姓名栏 */
        .name-sidebar {
            width: 100px;
            flex-shrink: 0;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            backdrop-filter: blur(8px);
        }
        .name-text {
            font-size: 28px;
            font-weight: bold;
            writing-mode: vertical-rl;
            letter-spacing: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        /* 右侧内容区 */
        .content-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        /* 三张照片容器 */
        .photos-group {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 180px;
        }
        .photo-item {
            flex: 1;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
            display: block;
        }
        .photo-item img.loaded { opacity: 1; }
        /* 视频容器 */
        .video-container {
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            width: 100%;
            padding-bottom: 42%;
            background: rgba(0, 0, 0, 0.3);
        }
        .video-container video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* ========== 水凝胶按钮 ========== */
        .liquid-btn {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.8), rgba(2, 132, 199, 0.88));
            backdrop-filter: blur(16px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 0.75rem;
            color: white;
            text-decoration: none;
            font-weight: 600;
            box-shadow: inset 0 1.5px 1px 0 rgba(255,255,255,0.45), 0 8px 24px -4px rgba(2,132,199,0.45);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .liquid-btn:hover {
            transform: translateY(-2px) scale(1.02);
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.95), rgba(2, 132, 199, 0.98));
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 2px 0 rgba(255,255,255,0.65), 0 12px 28px -2px rgba(2,132,199,0.65);
        }
        .liquid-btn:active { transform: scale(0.97); transition: transform 0.1s; }

        /* ========== 滚动渐显 ========== */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .person-template {
                flex-direction: column;
                min-height: auto;
            }
            .name-sidebar {
                width: 100%;
                height: 60px;
            }
            .name-text {
                writing-mode: horizontal-tb;
                letter-spacing: 6px;
                font-size: 22px;
            }
            .photos-group {
                min-height: 140px;
            }
        }
    </style>
</head>
<body>

    <!-- 动态极光流体背景 -->
    <div class="liquid-fluid-backdrop" aria-hidden="true">
        <div class="liquid-drop liquid-drop-1"></div>
        <div class="liquid-drop liquid-drop-2"></div>
        <div class="liquid-drop liquid-drop-3"></div>
    </div>

    <!-- 顶部胶囊形悬浮导航栏 -->
    <header class="fixed top-5 inset-x-0 z-50 flex justify-center px-4">
        <nav class="liquid-navbar px-6 py-2.5 flex items-center gap-6 max-w-4xl w-full justify-between">
            <a href="./index.html" class="flex items-center gap-2.5 no-underline">
                <img src="./logo.png" alt="缺德组织Logo" class="w-7 h-auto">
                <span class="font-bold text-base tracking-wide text-white">缺德组织</span>
            </a>
            <div class="hidden md:flex items-center gap-6">
                <a href="./index.html" class="nav-link">首页</a>
                <a href="./index2.html" class="nav-link">作品</a>
            </div>
            <a href="./index.html" class="px-4 py-1.5 rounded-full text-xs font-semibold text-white no-underline"
               style="background: rgba(2,132,199,0.8); box-shadow: 0 4px 12px rgba(2,132,199,0.3);">
                <i class="fa fa-home mr-1"></i>返回首页
            </a>
        </nav>
    </header>

    <!-- Hero 标题区 -->
    <section class="pt-36 pb-8 relative z-10">
        <div class="container mx-auto px-6 max-w-4xl text-center fade-in">
            <span class="section-label">Easter Egg</span>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mt-2 mb-3">
                <span class="text-liquid-shimmer">小彩蛋</span>
            </h1>
            <p class="text-gray-400 text-sm md:text-base font-light">惊喜隐藏内容</p>
        </div>
    </section>

    <!-- 人物卡片区域 -->
    <div class="relative z-10 pb-8">

        <!-- 女生模板1：一颗小兔娘 -->
        <div class="person-template female-template glass-card fade-in">
            <div class="name-sidebar">
                <div class="name-text">一颗小兔娘</div>
            </div>
            <div class="content-area">
                <div class="photos-group">
                    <div class="photo-item">
                        <img data-src="./female-photo1.jpg" alt="女生作品1" class="lazy">
                    </div>
                    <div class="photo-item">
                        <img data-src="./female-photo2.jpg" alt="女生作品2" class="lazy">
                    </div>
                    <div class="photo-item">
                        <img data-src="./female-photo3.jpg" alt="女生作品3" class="lazy">
                    </div>
                </div>
                <div class="video-container">
                    <video controls poster="./female-video-cover1.jpg" preload="none">
                        <source src="./female-video1.mp4" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                </div>
            </div>
        </div>

        <!-- 女生模板2：贝贝南瓜 -->
        <div class="person-template female-template glass-card fade-in">
            <div class="name-sidebar">
                <div class="name-text">贝贝南瓜</div>
            </div>
            <div class="content-area">
                <div class="photos-group">
                    <div class="photo-item">
                        <img data-src="./female-photo4.jpg" alt="女生作品1" class="lazy">
                    </div>
                    <div class="photo-item">
                        <img data-src="./female-photo5.jpg" alt="女生作品2" class="lazy">
                    </div>
                    <div class="photo-item">
                        <img data-src="./female-photo6.jpg" alt="女生作品3" class="lazy">
                    </div>
                </div>
                <div class="video-container">
                    <video controls poster="./female-video-cover2.jpg" preload="none">
                        <source src="./female-video2.mp4" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                </div>
            </div>
        </div>

        <!-- 男生模板：阿达西不懂车 -->
        <div class="person-template male-template glass-card fade-in">
            <div class="name-sidebar">
                <div class="name-text">阿达西不懂车</div>
            </div>
            <div class="content-area">
                <div class="photos-group">
                    <div class="photo-item">
                        <img data-src="./male-photo1.jpg" alt="男生作品1" class="lazy">
                    </div>
                    <div class="photo-item">
                        <img data-src="./male-photo2.jpg" alt="男生作品2" class="lazy">
                    </div>
                    <div class="photo-item">
                        <img data-src="./male-photo3.jpg" alt="男生作品3" class="lazy">
                    </div>
                </div>
                <div class="video-container">
                    <video controls poster="./male-video-cover1.jpg" preload="none">
                        <source src="./male-video1.mp4" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                </div>
            </div>
        </div>

        <!-- 蔡徐坤模板 -->
        <div class="person-template caixukun-template glass-card fade-in">
            <div class="name-sidebar">
                <div class="name-text">蔡徐坤</div>
            </div>
            <div class="content-area">
                <div class="photos-group">
                    <div class="photo-item">
                        <img data-src="./male-photo4.jpg" alt="男生作品1" class="lazy">
                    </div>
                    <div class="photo-item">
                        <img data-src="./male-photo5.jpg" alt="男生作品2" class="lazy">
                    </div>
                    <div class="photo-item">
                        <img data-src="./male-photo6.jpg" alt="男生作品3" class="lazy">
                    </div>
                </div>
                <div class="video-container">
                    <video controls poster="./male-video-cover2.jpg" preload="none">
                        <source src="./male-video2.mp4" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                </div>
            </div>
        </div>

    </div>

    <!-- 返回首页 -->
    <section class="py-12 relative z-10">
        <div class="container mx-auto px-6 text-center fade-in">
            <a href="./index.html" class="liquid-btn px-8 py-3.5 text-base">
                <i class="fa fa-home"></i>返回主页面
            </a>
        </div>
    </section>

    <!-- 懒加载 + 滚动渐显 JS -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 图片懒加载
            const lazyImages = document.querySelectorAll(".lazy");
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.classList.add("loaded");
                        observer.unobserve(img);
                    }
                });
            });
            lazyImages.forEach(img => imageObserver.observe(img));

            // 滚动渐显
            const fadeObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        fadeObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.fade-in').forEach(el => fadeObserver.observe(el));
        });
    </script>

</body>
</html>
